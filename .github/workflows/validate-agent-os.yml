name: Validate Agent OS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and compose stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Compile Python modules
        run: python -m py_compile agent/*.py

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Agent OS image
        run: docker compose build

      - name: Show deployment checklist
        run: |
          echo "Validation complete."
          echo "Next deployment commands:"
          echo "cp .env.example .env"
          echo "make up"
          echo "make health"
